<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<meta name="theme-color" content="#fafaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#fafaf8; --panel:#ffffff; --ink:#1c1c1e; --ink2:#55565b; --muted:#8a8b90;
  --line:#e6e6e3; --line2:#f0f0ed; --accent:#2f62c9; --accent-soft:#e8eefb;
  --warn:#a35a00; --warn-soft:#fdf3e4; --same:#fff4c2; --today:#f3f6fd; --bad:#b3261e;
  --ev:#7357c4; --ev-soft:#f1ecfb; --ev-ring:#c9b8f0; --off-bg:#fdf1e9; --off-bg2:#f9e0d0; --off-ink:#a35f3c; --q1:#dbe5f8; --q2:#a9c1ef; --q3:#6f97e2; --q4:#2f62c9; --hatch:#e9e9e5;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --panel:#1c1c1f; --ink:#ececee; --ink2:#b4b5ba; --muted:#86878d;
    --line:#2e2e32; --line2:#26262a; --accent:#7aa5f2; --accent-soft:#1f2a40;
    --warn:#e5a34b; --warn-soft:#33270f; --same:#4a3f12; --today:#1b2233; --bad:#f2867e;
    --ev:#c3adf5; --ev-soft:#2d2640; --ev-ring:#6f5aa8; --off-bg:#33261f; --off-bg2:#45322a; --off-ink:#efbd9d; --q1:#22304b; --q2:#2f4c80; --q3:#4a74c4; --q4:#86adf4; --hatch:#2c2c30; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:6px 11px;border-radius:8px;color:var(--ink2)}
nav.tabs button:hover{background:var(--line2)}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:8px 12px;margin:14px 0 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner button{margin-left:auto}
h1{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0}
h2{font-size:17px;font-weight:650;margin:0 0 10px}
h3{font-size:15px;font-weight:650;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#0e1420}}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--line2)}
.btn.icon{padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
section{margin-top:18px}
.weekhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.weekhead h1{min-width:250px;text-align:center}
.kpi{font-variant-numeric:tabular-nums}
.pill{white-space:nowrap;display:inline-block;padding:1px 8px;border-radius:999px;background:var(--line2);color:var(--ink2);font-size:13px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
input.date{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px}

/* grid */
.gridwrap{margin-top:14px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.grid{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
table.grid th,table.grid td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0}
table.grid th:last-child,table.grid td:last-child{border-right:0}
table.grid thead th{font-weight:600;text-align:left;padding:9px 10px 7px;border-bottom:1px solid var(--line);font-size:14px}
table.grid thead th .cnt{float:right;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
table.grid th.time,table.grid td.time{width:62px;color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
table.grid td.today,table.grid th.today{background:var(--today)}
table.grid tfoot td{padding:7px 10px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;border-bottom:0}
.cell{width:100%;border:0;background:transparent;padding:8px 10px;outline:none;min-height:36px;font-size:15px}
.cell:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.same{background:var(--same)}
.cell.tent{color:var(--ink2);font-style:italic}
.daytabs{display:none;gap:4px;margin-top:14px;overflow-x:auto}
.daytabs button{flex:1;min-width:54px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px;line-height:1.2}
.daytabs button small{display:block;color:var(--muted);font-size:12px}
.daytabs button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daytabs button.today{background:var(--today)}
.daylist{display:none}
@media (max-width:760px){
  .wrap{padding:0 12px 60px}
  .gridwrap.desk{display:none}
  .daytabs{display:flex}
  .daylist{display:block;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .daylist .r{display:flex;border-bottom:1px solid var(--line2);align-items:center}
  .daylist .r:last-child{border-bottom:0}
  .daylist .t{width:58px;text-align:center;color:var(--muted);font-size:13px}
  .cell{font-size:16px}
  .weekhead:not(.wk) h1{order:-1;flex:1 0 100%;min-width:0;font-size:20px;text-align:left}
  .weekhead:not(.wk) .sp{display:none}
}

/* calc */
.calc{display:grid;grid-template-columns:28px minmax(110px,1fr) minmax(150px,1.6fr) 120px 30px;gap:6px 8px;align-items:center}
.calc .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.calc .L{font-weight:650;color:var(--muted);text-align:center}
.calc input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.calc input.f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.calc .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.calc .v.err{color:var(--bad);font-weight:500;font-size:13px}
.calc .v.neg{color:var(--bad)}
@media (max-width:640px){.calc{grid-template-columns:20px 1fr 92px 28px}.calc .h{display:none}.calc .L{grid-column:1}.calc .nm{grid-column:2/4}.calc .f{grid-column:2}.calc .v{grid-column:3}.calc input.nm{border-color:transparent;background:none;padding-left:0;font-weight:600}}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols>*{min-width:0}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;resize:vertical;min-height:90px}

/* lists / tables */
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);overflow-wrap:anywhere}
table.t th,table.t td.n,table.t td.nw{white-space:nowrap}
table.t th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.t td.n,table.t th.n{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--line2)}
table.t tr.sel td{background:var(--accent-soft)}
table.t tfoot td{font-weight:650;border-bottom:0}
.tscroll{overflow-x:auto}
.kids{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:820px){.kids{grid-template-columns:1fr}}
.kidlist{max-height:70vh;overflow:auto;padding:4px}
.kid{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer}
.kid:hover{background:var(--line2)}
.kid.on{background:var(--accent-soft)}
.kid .c{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
input.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 11px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
details summary{cursor:pointer;color:var(--ink2)}
.flag{color:var(--warn)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

.toast.act{pointer-events:auto;cursor:pointer}
.toast u{margin-left:10px;opacity:.85}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal>.card{max-height:92vh;overflow:auto}
.form{display:grid;gap:10px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.form label.row{display:flex;flex-wrap:nowrap;align-items:flex-start}
.form label.row input{margin-top:3px;flex:none}
.lbl{width:48px;font-size:13px;color:var(--muted)}
.evstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.evchip{border:0;background:var(--ev-soft);color:var(--ev);border-radius:999px;padding:3px 11px;font-size:13px}
.hatch,td.off,th.off{background:var(--off-bg)}
.evchip.off,.ev.off{background:var(--off-bg2)}
.evchip.off,.ev.off{color:var(--off-ink)}
th.off .offlbl{color:var(--off-ink)}
.mc .ev.off{background:var(--off-bg2)}
.dayhd{border:0;background:none;padding:0;font-weight:600;cursor:pointer;text-align:left}
.dayhd:hover{text-decoration:underline}
.offlbl{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 46px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);margin-top:14px}
.mgrid .hd{padding:7px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.mc{min-height:104px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 6px 6px;cursor:pointer;min-width:0;position:relative}
.mc:hover{background:var(--line2)}
.mc.out{opacity:.4}
.mc.today .dn{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 5px}
.mc.wkend{background:color-mix(in srgb,var(--line2) 45%,transparent)}
.mh{display:flex;align-items:center;gap:6px;font-size:13px}
.mh .dn{font-weight:600}
.mh .mn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mh .add{margin-left:auto;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 3px;border-radius:5px;opacity:0}
.mc:hover .add{opacity:1}
.ev{font-size:12px;background:var(--ev-soft);color:var(--ev);border-radius:5px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml{margin-top:3px;font-size:11.5px;line-height:1.35;color:var(--ink2)}
.ml div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml span{color:var(--muted);font-variant-numeric:tabular-nums}
.ws{border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted);text-align:center;padding-top:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.ws:hover{background:var(--line2)}
@media (max-width:760px){.mgrid{grid-template-columns:repeat(7,minmax(0,1fr)) 30px}.mc{min-height:62px;padding:3px}.ml{display:none}.mh{flex-direction:column;align-items:flex-start;gap:0}.mh .mn{font-size:11px}.mh .zan{display:none}.ev{font-size:10px;padding:0 3px}.mh .add{display:none}.mgrid .hd{padding:6px 3px;font-size:11px}}
/* year */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin-top:14px}
.ym h3{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.ym h3:hover{text-decoration:underline}
.ym h3 small{font-weight:400;color:var(--muted);font-size:12px}
.yd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.yd .w{font-size:10px;color:var(--muted);text-align:center}
.yd .c{aspect-ratio:1;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums;background:var(--line2)}
.yd .c.e{background:none;cursor:default}
.yd .c.q1{background:var(--q1)} .yd .c.q2{background:var(--q2)} .yd .c.q3{background:var(--q3);color:#fff} .yd .c.q4{background:var(--q4);color:#fff}
@media (prefers-color-scheme: dark){.yd .c.q3,.yd .c.q4{color:#0e1420}}
.yd .c.off{color:var(--ink2)}
.yd .c.hasev{box-shadow:inset 0 0 0 2px var(--ev-ring)}
.yd .c.td{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--line2)}
.ytip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:7px;max-width:280px;z-index:30;opacity:0;transition:opacity .08s}

nav.tabs button{display:flex;align-items:center;gap:6px}
nav.tabs svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cw{position:relative}
.snd{display:none;align-items:center;justify-content:center;border:0;background:var(--panel);color:var(--accent);border-radius:7px;width:30px;height:28px;padding:0;flex:none}
.snd svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd:hover{background:var(--accent-soft)}
.cw .snd{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
td:hover .snd.on,td:focus-within .snd.on{display:flex}
.titlepick{position:relative;display:inline-block}
.titlepick input{display:none}
.acts{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap}
@media (max-width:760px){
  header.top{position:static;border-bottom:0;background:none;backdrop-filter:none}
  header.top .wrap{padding:0}
  .brand{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 0;border-radius:10px}
  nav.tabs button.on{background:none;color:var(--accent)}
  nav.tabs svg{display:block}
  .wrap{padding:0 12px calc(90px + env(safe-area-inset-bottom))}
  body{padding-top:env(safe-area-inset-top)}
  .banner{margin-top:10px;font-size:13px;padding:8px 10px}
  .weekhead.wk{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:12px}
  .weekhead.wk h1{grid-column:2;grid-row:1;text-align:center;font-size:18px;min-width:0;order:0;flex:none}
  .weekhead.wk #wPrev{grid-column:1;grid-row:1;height:40px}
  .weekhead.wk #wNext{grid-column:3;grid-row:1;height:40px}
  .weekhead.wk .desk{display:none}
  .weekhead.wk .acts{grid-column:1/4;flex-wrap:wrap;gap:6px}
  .weekhead.wk #wShare{margin-left:auto}
  .weekhead.wk .acts .btn{padding:8px 11px}
  .titlepick input{display:block;position:absolute;inset:0;opacity:0;width:100%;height:100%}
  .daytabs{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;margin-top:4px}
  .daytabs button{padding:8px 4px}
  .daylist{margin-top:4px}
  .daylist .r{min-height:50px}
  .daylist .snd.on{display:flex;margin-right:8px;width:38px;height:36px;background:var(--accent-soft)}
  .evstrip{margin-top:8px}
  input,select,textarea,.search,.date{font-size:16px!important}
  .modal{align-items:flex-end;padding:0}
  .modal>.card{width:100%!important;border-radius:16px 16px 0 0;max-height:94vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal .seg button{padding:7px 10px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .cols{gap:12px}
  section{margin-top:12px}
}

table.grid tfoot td.dacc{vertical-align:top;color:var(--ink2);padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5}
table.grid tfoot td.time{border-top:1px solid var(--line);vertical-align:top;padding-top:9px;font-size:12px}
.dacc b{display:block;color:var(--ink);font-size:13px;font-weight:650}
.dacc .ln{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.dacc .ln span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.dacc .ln span:last-child{font-variant-numeric:tabular-nums}
.dacc .ln.tot{border-top:1px solid var(--line);margin-top:3px;padding-top:3px;color:var(--ink);font-weight:650}
.dacc .ln.tot span:first-child{color:var(--ink)}
.dfoot{display:none}
@media (max-width:760px){.dfoot{display:block;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}.dfoot .dacc{font-size:14px}}
.pill.link{border:0;cursor:pointer}
.pill.link:hover{background:var(--accent-soft);color:var(--accent)}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}
.steps li{margin:5px 0}
.ic{width:18px;height:18px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.yd .c{flex-direction:column;line-height:1;gap:1px}
.yd .c .yn{font-size:10px}
.yd .c.has .yn{font-size:8px;opacity:.8}
.yd .c .yc{font-size:11.5px;font-weight:700}
.ym{scroll-margin-top:70px}
.ym.cur{box-shadow:0 0 0 2px var(--accent)}
.card.dacc .ln{font-size:14px}
@media (max-width:760px){.ym{scroll-margin-top:12px}}

html{overflow-x:clip}
main,section,.card{min-width:0}
/* общая шапка периода: ‹ заголовок › на всю ширину */
.phead{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-top:16px;touch-action:pan-y}
.phead .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;line-height:1;padding:0;color:var(--ink)}
.phead .nav:active{background:var(--line2)}
.ptitle{text-align:center;min-width:0}
.ptitle h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:21px}
.ptitle .titlepick{position:relative;display:inline-block;max-width:100%;cursor:pointer}
.ptitle .titlepick input{display:block;position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ptitle .titlepick h1{display:inline}
.ptitle .titlepick::after{content:"▾";position:absolute;left:100%;top:50%;transform:translateY(-45%);margin-left:4px;font-size:12px;color:var(--muted)}
.psub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.psub button{border:0;background:none;padding:0;color:var(--accent);font-size:13px}
.psub .k{color:var(--ink2)}
/* сноски-события */
.notes-ev{margin:10px auto 0;max-width:640px;display:grid;gap:4px}
.notes-ev button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:2px 4px;text-align:left;font-size:13px;color:var(--ink2);min-width:0}
.notes-ev i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ev)}
.notes-ev i.off{background:var(--off-ink)}
.notes-ev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* спокойная панель действий */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px auto 0;max-width:640px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 4px;font-size:12px;color:var(--ink2)}
.tools button:hover{border-color:var(--muted)}
.tools button:disabled{opacity:.4}
.tools svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.segfull{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.segfull button{border:0;background:none;padding:8px 6px;color:var(--ink2);font-size:14px}
.segfull button.on{background:var(--ink);color:var(--bg)}
.navrow{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px}
.navrow b{text-align:center}
.navrow .nav{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:19px;padding:0}
.calbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:640px;margin:12px auto 0;align-items:center}
.calbar .btn{height:100%}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* карточка ребёнка */
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kstats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.kstats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kstats span{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.hbar .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.hbar .lbl{color:var(--muted);font-variant-numeric:tabular-nums}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums}
.kidrow{cursor:pointer}
.kidrow:hover td{background:var(--line2)}
.snd.info svg{stroke-width:1.8}

.mh .mn{margin-left:auto;font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums;line-height:1.4}
.mh .add{margin-left:4px}
.mc .mh .dn{font-size:14px}
.yd .c{position:relative}
.yd .c .yn{font-size:11px}

<body>
<header class="top"><div class="wrap">
  <div class="brand">Расписание</div>
  <nav class="tabs" id="tabs">
    <button data-v="week"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M9 9v10M14 9v10"/></svg><span>Неделя</span></button>
    <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Календарь</span></button>
    <button data-v="acc"><svg viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></svg><span>Учёт</span></button>

  <main id="main"></main>
</div>
<datalist id="kidnames"></datalist>
<div class="toast" id="toast"></div>
<script id="seed" type="application/json">{"v": 1, "settings": {"template": [{"name": "Сумма 1", "f": "2600*N"}, {"name": "Сумма 2", "f": "N*1600"}, {"name": "Итог", "f": "A+B-135000"}]}, "weeks": {}, "events": []}</script>
<script>
"use strict";
const APP_SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const APP_VERSION = '2026-11-08.4';
/* ============ constants & utils ============ */
const KEY = 'kirill-schedule-app-v1';
const DAY = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DAYL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const DAYA = ['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtNum = (v, dec=0) => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('ru-RU',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtMoney = v => fmtNum(Math.round(v)).replace('-', '−');
const monthKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const monthName = mk => { const [y,m] = mk.split('-').map(Number); return MN[m-1]+' '+y; };
const dShort = d => d.getDate()+' '+MG[d.getMonth()];
function weekTitle(key, n){
  const a = pdate(key), b = addDays(a, (n||5)-1);
  if (a.getMonth()===b.getMonth()) return a.getDate()+'–'+b.getDate()+' '+MG[a.getMonth()]+' '+a.getFullYear();
  if (a.getFullYear()===b.getFullYear()) return dShort(a)+' – '+dShort(b)+' '+b.getFullYear();
  return dShort(a)+' '+a.getFullYear()+' – '+dShort(b)+' '+b.getFullYear();
}
function weekShort(key){
  const a = pdate(key), b = addDays(a, 4);
  return a.getMonth()===b.getMonth() ? a.getDate()+'–'+b.getDate()+' '+MS[a.getMonth()] : a.getDate()+' '+MS[a.getMonth()]+' – '+b.getDate()+' '+MS[b.getMonth()];
}
const weekMonth = key => monthKey(addDays(pdate(key), 3)); // неделя относится к месяцу своего четверга
function toast(msg, act){
  const t=$('#toast'); t.innerHTML = esc(msg) + (act ? `<u>${esc(act.label)}</u>` : '');
  t.classList.add('on'); t.classList.toggle('act', !!act);
  t.onclick = act ? () => { t.classList.remove('on','act'); act.fn(); } : null;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on','act'), act ? 6000 : 1800);
}

/* ============ state ============ */
const SEED = JSON.parse(document.getElementById('seed').textContent);
const OLD_TPL = [{name:'Сумма 1',f:'2600*N'},{name:'Сумма 2',f:'N*1600'},{name:'Итог',f:'A+B-135000'}];
const NEW_TPL = [{name:'Сумма 1',f:'2600*N'},{name:'Сумма 2',f:'N*1600'},{name:'Суббота',f:'3000*СБ'},{name:'Итог',f:'A+B+C-135000'}];
const DEFAULTS = { from: 9, to: 20, days: 6, satRate: 3000, template: clone(NEW_TPL), lastExport: null };
function migrate(){
  const st = S.settings;
  if (!st.satV){
    st.days = Math.max(6, st.days||6); st.satRate = st.satRate || 3000;
    const old = JSON.stringify(OLD_TPL), same = c => JSON.stringify((c||[]).map(l=>({name:l.name,f:l.f})))===old;
    if (same(st.template)) st.template = clone(NEW_TPL);
    Object.values(S.weeks||{}).forEach(w => { if (!w.calcEdited && same(w.calc)) w.calc = clone(NEW_TPL); });
    st.satV = 1;
  }
}
let S;
const fmtDT = t => t ? new Date(t).toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : '—';
function fromSeed(){
  return { v:1, weeks: clone(SEED.weeks||{}), events: clone(SEED.events||[]), settings: Object.assign({}, SEED.settings||{}), updatedAt: SEED.updatedAt || 0, savedAt: SEED.savedAt };
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) {}
  let local = null; try { local = raw ? JSON.parse(raw) : null; } catch(e) {}
  if (!local) S = fromSeed();
  else if ((SEED.updatedAt||0) > (local.updatedAt||0) && confirm(`В этом файле сохранены более новые данные (${fmtDT(SEED.savedAt||SEED.updatedAt)}), чем в браузере (${fmtDT(local.updatedAt)}).\n\nОткрыть данные из файла? Данные браузера можно будет вернуть во вкладке «Данные» → «Отменить».`)){
    S = fromSeed();
    try { localStorage.setItem(KEY+'-undo', JSON.stringify({label:'Открытие данных из файла', at:Date.now(), data:local})); } catch(e){}
  } else S = local;
  S.settings = Object.assign({}, DEFAULTS, S.settings || {});
  if (!Array.isArray(S.events)) S.events = [];
  migrate();
  initStamp();
  const prevV = S.settings.appVersion;
  if (prevV !== APP_VERSION){
    // перед любым обновлением версии сохраняем полную копию данных в этом же браузере
    if (Object.keys(S.weeks).length){ try { localStorage.setItem(KEY+'-preupdate', JSON.stringify({from: prevV || 'ранняя версия', to: APP_VERSION, at: Date.now(), data: clone(S)})); } catch(e){} }
    S.settings.appVersion = APP_VERSION;
    if (prevV || raw) V.updatedFrom = prevV || 'ранней версии';
  }
  persist();
}
let storageOK = true;
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function save(){ S.updatedAt = Date.now(); const ch = stampChanges(); persist(); renderBanner(); clearTimeout(save._t); save._t = setTimeout(dailySnapshot, 2000); if (ch) syncSoon(); }
/* автокопии: одна на каждый день работы, последние 14 дней, хранятся в этом же браузере */
function dailySnapshots(){ try { return JSON.parse(localStorage.getItem(KEY+'-daily') || '[]'); } catch(e){ return []; } }
function dailySnapshot(){
  const day = ymd(today()); let arr = dailySnapshots().filter(x => x.day !== day);
  arr.unshift({day, at: Date.now(), data: S});
  for (let keep = 14; keep >= 2; keep -= 3){
    try { localStorage.setItem(KEY+'-daily', JSON.stringify(arr.slice(0, keep))); return; } catch(e){}
  }
}
function snapshot(label){ try{ localStorage.setItem(KEY+'-undo', JSON.stringify({label, at:Date.now(), data:S})); }catch(e){} }
window.addEventListener('storage', e => { if (e.key===KEY && e.newValue){ S = JSON.parse(e.newValue); S.settings = Object.assign({}, DEFAULTS, S.settings||{}); if (!Array.isArray(S.events)) S.events = []; dirty(); render(); } });

/* ============ entries & children ============ */
function parseEntry(txt){
  let t = String(txt||'').replace(/\s+/g,' ').trim();
  const tentative = t.includes('?');
  t = t.replace(/[?:.!,\s]+$/,'').replace(/\?/g,'').trim();
  let suffix = '', m;
  if ((m = t.match(/\s*(\d+\s*\/\s*\d+)$/))) { suffix = m[1].replace(/\s/g,''); t = t.slice(0, m.index).trim(); }
  else if ((m = t.match(/\s+(\d{1,2}:\d{2})$/))) { suffix = m[1]; t = t.slice(0, m.index).trim(); }
  else if (!/\d+[.,]\d+$/.test(t) && (m = t.match(/\s*(\d{1,2})$/)) && m.index > 0) { suffix = m[1]; t = t.slice(0, m.index).trim(); }
  const key = t.toLowerCase().replace(/ё/g,'е');
  return { base: t, key, suffix, tentative };
}
function entries(w){ const out=[]; if(!w) return out; for (const i in w.d) for (const t in w.d[i]) { const v=w.d[i][t]; if (v && v.trim()) out.push({i:+i, t, txt:v}); } return out; }
const weekCount = w => entries(w).length;                       // все занятия недели, включая субботу
const weekdayCount = w => entries(w).filter(e => e.i < 5).length; // Пн–Пт
const satCount = w => entries(w).filter(e => e.i === 5).length;   // суббота
const weekN = w => (w && w.n != null) ? w.n : weekdayCount(w);
function slots(){
  const out=[]; for (let h=S.settings.from; h<=S.settings.to; h++) out.push(pad(h)+':00'); return out;
}
function weekSlots(w){
  const set = new Set(slots());
  entries(w).forEach(e => set.add(e.t));
  return [...set].sort();
}
let _idx = null;
function index(){
  if (_idx) return _idx;
  const kids = new Map();
  for (const [key, w] of Object.entries(S.weeks)){
    const mon = pdate(key);
    for (const e of entries(w)){
      const p = parseEntry(e.txt); if (!p.key) continue;
      let k = kids.get(p.key);
      if (!k){ k = {key:p.key, names:{}, ss:[]}; kids.set(p.key, k); }
      k.names[p.base] = (k.names[p.base]||0)+1;
      const date = addDays(mon, e.i);
      k.ss.push({date, ds:ymd(date), t:e.t, txt:e.txt, p, week:key, i:e.i});
    }
  }
  for (const k of kids.values()){
    k.name = Object.entries(k.names).sort((a,b)=>b[1]-a[1])[0][0];
    k.ss.sort((a,b)=> a.ds===b.ds ? a.t.localeCompare(b.t) : a.ds.localeCompare(b.ds));
  }
  return (_idx = kids);
}
function dirty(){ _idx = null; }
function refreshDatalist(){
  const lim = ymd(addDays(today(), -150));
  const names = [...index().values()].filter(k => k.ss.some(s=>s.ds>=lim)).map(k=>k.name).sort((a,b)=>a.localeCompare(b,'ru'));
  $('#kidnames').innerHTML = names.map(n=>`<option value="${esc(n)}">`).join('');
}

/* ============ formulas ============ */
const CYR = {'А':'A','В':'B','С':'C','Е':'E','Н':'N','н':'N','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X','а':'A','в':'B','с':'C','е':'E'};
function tokenize(src){
  const s = String(src||'').replace(/^\s*=/,'').replace(/[−–—]/g,'-').replace(/[×·∙]/g,'*').replace(/÷/g,'/');
  const out=[]; let i=0;
  while (i < s.length){
    const ch = s[i];
    if (/\s/.test(ch)){ i++; continue; }
    if (/[0-9]/.test(ch)){
      let j=i; while (j<s.length && (/[0-9,.]/.test(s[j]) || (s[j]===' ' && /[0-9]/.test(s[j+1]||'') && /[0-9]/.test(s[j-1])))) j++;
      out.push({t:'num', v: parseFloat(s.slice(i,j).replace(/\s/g,'').replace(',','.'))}); i=j; continue;
    }
    if ('+-*/()'.includes(ch)){ out.push({t:ch}); i++; continue; }
    if (/[A-Za-zА-Яа-яЁё]/.test(ch)){
      let j=i; while (j<s.length && /[A-Za-zА-Яа-яЁё]/.test(s[j])) j++;
      const word = s.slice(i,j), W = word.toUpperCase().replace(/Ё/g,'Е'); i = j;
      if (word==='x' || word==='х'){ out.push({t:'*'}); continue; }
      if (['СБ','SB','СУБ','СУББОТА','SAT'].includes(W)){ out.push({t:'id', v:'SB'}); continue; }
      if (word.length===1){ const L = (CYR[word] || word).toUpperCase(); if (/^[A-Z]$/.test(L)){ out.push({t:'id', v:L}); continue; } }
      throw new Error('непонятно «'+word+'»');
    }
    throw new Error('символ «'+ch+'»');
  }
  return out;
}
function compile(src){
  const tk = tokenize(src); let p = 0;
  const peek = () => tk[p] && tk[p].t, next = () => tk[p++];
  function expr(){ let a = term(); while (peek()==='+'||peek()==='-'){ const op=next().t; a={k:'b',op,a,b:term()}; } return a; }
  function term(){ let a = fac(); while (peek()==='*'||peek()==='/'){ const op=next().t; a={k:'b',op,a,b:fac()}; } return a; }
  function fac(){
    const t = next(); if (!t) throw new Error('формула не закончена');
    if (t.t==='-') return {k:'neg', a:fac()};
    if (t.t==='+') return fac();
    if (t.t==='num') return {k:'n', v:t.v};
    if (t.t==='id') return {k:'id', v:t.v};
    if (t.t==='('){ const e = expr(); if (next()?.t!==')') throw new Error('нет «)»'); return e; }
    throw new Error('лишний «'+t.t+'»');
  }
  if (!tk.length) throw new Error('пусто');
  const e = expr(); if (p < tk.length) throw new Error('лишнее после формулы');
  return e;
}
function evalAst(a, get){
  switch(a.k){
    case 'n': return a.v;
    case 'id': return get(a.v);
    case 'neg': return -evalAst(a.a, get);
    case 'b': { const x=evalAst(a.a,get), y=evalAst(a.b,get);
      return a.op==='+'?x+y:a.op==='-'?x-y:a.op==='*'?x*y:x/y; }
  }
}
const letter = i => String.fromCharCode(65+i);
function calcWeek(w){
  const lines = (w && w.calc) || [], N = weekN(w), memo = {}, busy = {};
  function val(i){
    if (i in memo){ if (memo[i] instanceof Error) throw memo[i]; return memo[i]; }
    if (busy[i]) throw new Error('цикл');
    busy[i]=1;
    try { const v = evalAst(compile(lines[i].f), get); memo[i]=v; return v; }
    catch(e){ memo[i]=e; throw e; } finally { busy[i]=0; }
  }
  function get(id){ if (id==='N') return N; if (id==='SB') return satCount(w); const i = id.charCodeAt(0)-65; if (i<0||i>=lines.length) throw new Error('нет строки '+id); return val(i); }
  return lines.map((l,i)=>{ try { return {v: val(i)}; } catch(e){ return {err: e.message}; } });
}
function formulaToExcel(src, nRef, refOf, sbRef){

/* ============ week ops ============ */
function ensureWeek(key){
  if (!S.weeks[key]) S.weeks[key] = {d:{}};
  const w = S.weeks[key];
  if (!w.d) w.d = {};
  if (!w.calc) w.calc = clone(S.settings.template);
  return w;
}
function tidyWeek(key){
  const w = S.weeks[key]; if (!w) return;
  for (const i in w.d) if (!Object.keys(w.d[i]).length) delete w.d[i];
  if (!entries(w).length && !w.notes && !w.calcEdited && w.n==null) delete S.weeks[key];
}
function setCell(key, i, t, val){
  val = String(val||'').replace(/\s+/g,' ').trim();
  if (!val){ const w = S.weeks[key]; if (w && w.d[i]) delete w.d[i][t]; tidyWeek(key); }
  else {
    const w = ensureWeek(key); (w.d[i] || (w.d[i]={}))[t] = val;
    if (+i===5 && !w.calc.some(l => { try { return tokenize(l.f).some(x=>x.v==='SB'); } catch(e){ return false; } })){
      w.calc.push({name:'Суббота', f: S.settings.satRate+'*СБ'});
      toast('В учёт недели добавлена строка «Суббота» ('+fmtNum(S.settings.satRate)+' × детей)');
    }
  }
  dirty(); save();
}

function addSwipe(el, onLeft, onRight){

    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - t0 > 800) return;
    (dx < 0 ? onLeft : onRight)();
  });
}

function markSame(inp){
  $$('.cell.same').forEach(c=>c.classList.remove('same'));
  const k = parseEntry(inp.value).key; if (!k) return;

function moveFocus(e, inp){
  const vis = $$('.cell').filter(c => c.offsetParent);
  const i = inp.dataset.i, t = inp.dataset.t;
  const col = vis.filter(c => c.dataset.i===i);
  const k = col.indexOf(inp);
  let target = null;
  if (e.key==='Enter' || e.key==='ArrowDown') target = col[k + (e.shiftKey && e.key==='Enter' ? -1 : 1)];
  else if (e.key==='ArrowUp') target = col[k-1];
  else if ((e.key==='ArrowRight' && inp.selectionStart===inp.value.length) || (e.key==='ArrowLeft' && inp.selectionStart===0)){
    target = vis.find(c => c.dataset.t===t && +c.dataset.i === +i + (e.key==='ArrowRight'?1:-1));
  }
  if (target){ e.preventDefault(); target.focus(); target.select(); }
}

/* учёт дня: занятия дня × ставки из формул недели (строки вида ставка*N; недельные вычеты не делятся по дням) */
function rateLines(w, v){
  const lines = (w && w.calc) || S.settings.template, out = [];
  lines.forEach((l,i) => {
    try {
      const ids = tokenize(l.f).filter(t => t.t==='id');
      if (!ids.length || ids.some(t => t.v!==v)) return;
      const ast = compile(l.f), f = x => evalAst(ast, () => x);
      const rate = f(1) - f(0);
      if (rate && isFinite(rate) && Math.abs(f(2) - f(0) - 2*rate) < 1e-6) out.push({name: l.name || letter(i), rate});
    } catch(e){}
  });
  return out;
}
function dayAccHTML(w, i){
  const c = w && w.d[i] ? Object.values(w.d[i]).filter(v=>v.trim()).length : 0;
  if (!c) return '<span class="muted">нет занятий</span>';
  let rates = rateLines(w, i===5 ? 'SB' : 'N');
  if (i===5 && !rates.length) rates = [{name:'Суббота', rate:S.settings.satRate}];
  const total = rates.reduce((a,r)=>a+r.rate*c, 0);
  return `<b>${c} ${plural(c,'занятие','занятия','занятий')}</b>` +
    rates.map(r => `<div class="ln" title="${esc(r.name)}: ${fmtNum(r.rate)} × ${c}"><span>${i===5 ? fmtNum(r.rate)+' × '+c : esc(r.name)}</span><span>${fmtMoney(r.rate*c)}</span></div>`).join('') +
    (rates.length > 1 ? `<div class="ln tot"><span>Общая</span><span>${fmtMoney(total)}</span></div>` : '');
}
const plural = (n, a, b, c) => { const m10 = n%10, m100 = n%100; return m10===1 && m100!==11 ? a : m10>=2 && m10<=4 && (m100<12 || m100>14) ? b : c; };
function copyPrevWeek(){

/* ---- texts ---- */
const evShort = e => `${e.time?e.time+' ':''}${e.title}${e.off?' — приёма нет':''}`;
function weekText(key, withEv=true){
  const w = S.weeks[key], mon = pdate(key);
  const lines = ['Расписание на неделю ' + weekTitle(key, S.settings.days), ''];
  if (withEv){ const ev = eventsBetween(key, ymd(addDays(mon,6))); if (ev.length){ ev.forEach(e => lines.push('• '+evLine(e))); lines.push(''); } }
  let any = false;
  for (let i=0;i<S.settings.days;i++){
    const d = addDays(mon,i), day = (w && w.d[i]) || {};
    const ts = Object.keys(day).filter(t=>day[t].trim()).sort();
    if (!ts.length) continue;
    any = true;
    lines.push(`${DAY[i]}, ${dShort(d)}`);
    ts.forEach(t => lines.push(`${t} ${day[t]}`));
    lines.push('');
  }
  if (!any) lines.push('Занятий нет.');
  return lines.join('\n').trim();
}
function dayText(key, i, withEv=true){
  const d = addDays(pdate(key), i), w = S.weeks[key], day = (w && w.d[i]) || {};
  const ts = Object.keys(day).filter(t=>day[t].trim()).sort();
  const out = [`Расписание на ${DAYA[i]}, ${dShort(d)}`, ''];
  if (withEv){ const ev = eventsOn(ymd(d)); if (ev.length){ ev.forEach(e => out.push('• '+evShort(e))); out.push(''); } }
  ts.forEach(t => out.push(`${t} ${day[t]}`));
  if (!ts.length) out.push('Занятий нет.');
  return out.join('\n').trim();
}
function kidWeekSessions(kid, key){ return kid.ss.filter(s => s.week===key); }
function kidText(kid, key, withEv=true){
  const ss = kidWeekSessions(kid, key);
  const out = [`${kid.name} — расписание на неделю ${weekTitle(key, S.settings.days)}`, ''];
  if (!ss.length) out.push('Занятий на этой неделе нет.');
  ss.forEach(s => {
    const extra = [];
    if (/\//.test(s.p.suffix)) extra.push('занятие '+s.p.suffix);
    if (s.p.tentative) extra.push('время уточняется');
    const time = /:/.test(s.p.suffix) ? s.p.suffix : s.t;
    const dn = DAYL[s.i][0].toUpperCase() + DAYL[s.i].slice(1);
    out.push(`${dn}, ${dShort(s.date)} — ${time}${extra.length ? ' ('+extra.join(', ')+')' : ''}`);
  });
  if (withEv){
    const off = eventsBetween(key, ymd(addDays(pdate(key),6))).filter(e=>e.off);
    if (off.length){ out.push(''); off.forEach(e => out.push(`Обратите внимание: ${evDates(e)} — приёма нет${e.title?' ('+e.title+')':''}.`)); }
  }
  return out.join('\n');
}
function modal(inner, width=560){
  const dlg = document.createElement('div'); dlg.className = 'modal';

  document.body.appendChild(dlg);

  const close = () => { dlg.remove(); document.removeEventListener('keydown', onKey); };

function copyText(text, ta){

/* ============ KIDS (rename) ============ */
function renameKid(kid, newName){
  newName = newName.replace(/\s+/g,' ').trim(); if (!newName || newName===kid.name && Object.keys(kid.names).length===1) return;
  const target = parseEntry(newName).key, exists = index().has(target) && target!==kid.key;
  if (!confirm(exists ? `Объединить «${kid.name}» с «${index().get(target).name}»? Записей: ${kid.ss.length}.` : `Переименовать «${kid.name}» → «${newName}» в ${kid.ss.length} записях?`)) return;
  snapshot('Переименование «'+kid.name+'»');
  const newBase = exists ? index().get(target).name : newName;
  for (const s of kid.ss){
    const w = S.weeks[s.week]; const txt = w.d[s.i][s.t];
    const t = txt.replace(/\s+/g,' ').trim();
    const pos = t.toLowerCase().replace(/ё/g,'е').indexOf(kid.key);
    w.d[s.i][s.t] = pos===0 ? newBase + t.slice(s.p.base.length) : newBase + (s.p.suffix ? ' '+s.p.suffix : '') + (s.p.tentative?'?':'');
  }
  dirty(); save(); render(); toast('Готово');
}

/* ============ ACCOUNTING ============ */
function accWeeks(m){ return Object.keys(S.weeks).filter(k => weekMonth(k)===m && (entries(S.weeks[k]).length || S.weeks[k].calc)).sort(); }
function accAgg(ks){
  const names = [], rows = ks.map(k => {
    const w = S.weeks[k], res = calcWeek(w), vals = {};
    (w.calc||[]).forEach((l,i) => { const nm = l.name || letter(i); if (!names.includes(nm)) names.push(nm); vals[nm] = res[i]; });
    return {k, w, vals};
  });
  const sumN = rows.reduce((a,r)=>a+weekN(r.w),0), sumSat = rows.reduce((a,r)=>a+satCount(r.w),0);
  const sums = {}; names.forEach(n => sums[n] = rows.reduce((a,r)=> a + (r.vals[n] && !r.vals[n].err ? r.vals[n].v : 0), 0));
  return {names, rows, sumN, sumSat, sums};
}

/* ============ STATS ============ */
function collect(fromDs, toDs){
  const out = [];
  for (const [key, w] of Object.entries(S.weeks)){
    const mon = pdate(key);
    for (const e of entries(w)){
      const d = addDays(mon, e.i), ds = ymd(d);

const tile = (k, v, s) => `<div class="tile"><div class="k">${k}</div><div class="val">${v}</div><div class="s">${s}</div></div>`;

function barChart(el, data, o={}){

  const max = Math.max(...data.map(d=>d.v), o.avg||0); const step = max>150?50:max>60?20:max>20?10:5; const top = Math.ceil(max/step)*step || step;
  const bw = (W-L-R)/data.length, barW = Math.max(3, Math.min(42, bw*0.7));
  const y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for (let v=0; v<=top; v+=step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v}</text>`;
  const maxI = data.reduce((a,d,i)=> d.v > data[a].v ? i : a, 0);
  const labelEvery = Math.ceil(data.length / Math.floor((W-L-R) / (narrow ? 34 : 44)));
  data.forEach((d,i) => {
    const x = L + bw*i + (bw-barW)/2, h = Math.max(0, y(0)-y(d.v)), r = Math.min(4, h/2, barW/2);
    g += `<path d="M${x},${y(0)} V${y(d.v)+r} Q${x},${y(d.v)} ${x+r},${y(d.v)} H${x+barW-r} Q${x+barW},${y(d.v)} ${x+barW},${y(d.v)+r} V${y(0)} Z" fill="var(--accent)" opacity="${d.light?0.4:1}"/>`;
    const showVal = o.labels==='all' ? (bw >= 22) : (i===maxI || i===data.length-1);
    if (showVal && d.v) g += `<text x="${x+barW/2}" y="${y(d.v)-5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink2)">${d.v}</text>`;
    if (i % labelEvery === 0 || i===data.length-1 && labelEvery===1) g += `<text x="${x+barW/2}" y="${H-B+15}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.label}</text>`;
    g += `<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`;
  });
  if (o.avg){ g += `<line x1="${L}" x2="${W-R}" y1="${y(o.avg)}" y2="${y(o.avg)}" stroke="var(--ink2)" stroke-dasharray="4 4" stroke-width="1"/>`; }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg><div class="tip"></div>`;
  const tip = $('.tip', el), svg = $('svg', el);
  const show = rc => { const d = data[+rc.dataset.i], sc = svg.getBoundingClientRect().width / W; tip.innerHTML = d.tip || (d.label+': '+d.v);
    const cx = (L + bw*(+rc.dataset.i) + bw/2) * sc; tip.style.left = Math.min(Math.max(cx, 80), svg.getBoundingClientRect().width - 80) + 'px'; tip.style.top = (y(d.v)*sc - 6) + 'px'; tip.style.opacity = 1; };
  $$('rect[data-i]', svg).forEach(rc => { rc.addEventListener('mouseenter', () => show(rc)); rc.addEventListener('click', () => show(rc)); rc.addEventListener('mouseleave', () => tip.style.opacity = 0); });
}

    try {
      let txt = String(r.result), d;
      if (/^\s*</.test(txt)){
        const m = txt.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);
        if (!m) throw new Error('в файле нет данных расписания');
        d = JSON.parse(m[1]);
      } else d = JSON.parse(txt);
      if (!d.weeks || typeof d.weeks!=='object') throw new Error('в файле нет недель');
      const when = d.savedAt || d.updatedAt;
      if (!confirm(`Открыть копию${when?' от '+fmtDT(when):''}: ${Object.keys(d.weeks).length} недель, событий ${(d.events||[]).length}? Текущие данные заменятся (их можно вернуть кнопкой «Отменить»).`)) return;

const colL = c => { let s=''; c++; while(c){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; };
const xesc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');

function sheetXML(rows, widths){

  if (widths) x += '<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  x += '<sheetData>';
  rows.forEach((row, r) => { if (!row) return; x += `<row r="${r+1}">`;
    row.forEach((c, ci) => { if (c==null || c==='') return; if (typeof c!=='object') c = {v:c};
      const ref = colL(ci)+(r+1), s = c.s ? ` s="${c.s}"` : '';
      if (c.f!=null) x += `<c r="${ref}"${s}><f>${xesc(c.f)}</f>${typeof c.v==='number'&&isFinite(c.v)?`<v>${c.v}</v>`:''}</c>`;
      else if (typeof c.v==='number') x += `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      else x += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xesc(c.v)}</t></is></c>`;
    }); x += '</row>'; });
  return x + '</sheetData></worksheet>';
}

const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zipStore(files){
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  for (const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true);
    c.setUint32(38,0,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let p = 0; all.forEach(a => { out.set(a,p); p += a.length; });
  return out;
}


/* ============ events ============ */
const evList = () => S.events || (S.events = []);
const eventsOn = ds => evList().filter(e => e.from <= ds && (e.to||e.from) >= ds);
const eventsBetween = (a, b) => evList().filter(e => e.from <= b && (e.to||e.from) >= a).sort((x,y)=>x.from.localeCompare(y.from));
function evDates(e){
  const a = pdate(e.from), b = pdate(e.to||e.from);
  if (a.getTime()===b.getTime()) return dShort(a);
  if (a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear()) return a.getDate()+'–'+dShort(b);
  return dShort(a)+' – '+dShort(b);
}
const evLine = e => `${evDates(e)}${e.time?', '+e.time:''} — ${e.title}${e.off?' (приёма нет)':''}`;
function openEvent(ev){
  if (!ev) return;
  const isNew = !ev.id;
  const m = modal(`${mhead(isNew?'Новое событие':'Событие')}
    <div class="form">
      <label>Название<input id="eT" class="search" value="${esc(ev.title||'')}" placeholder="Конференция, отпуск, праздник, семинар…"></label>
      <div class="row" style="align-items:end">
        <label>С<input type="date" id="eF" class="date" value="${ev.from}"></label>
        <label>По<input type="date" id="eTo" class="date" value="${ev.to||ev.from}"></label>
        <label>Время<input id="eTm" class="date" style="width:110px" value="${esc(ev.time||'')}" placeholder="10:00"></label>
      </div>
      <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" id="eOff" ${ev.off?'checked':''}> Приёма нет в эти дни (отпуск, выезд, праздник)</label>
      <label>Заметка<textarea id="eN" style="min-height:60px">${esc(ev.note||'')}</textarea></label>
    </div>
    <div class="row" style="margin-top:12px">${isNew?'':'<button class="btn ghost" id="eDel" style="color:var(--bad)">Удалить</button>'}<span class="sp"></span><button class="btn" data-x>Отмена</button><button class="btn pri" id="eSave">Сохранить</button></div>`, 500);
  const el = m.el; $('#eT', el).focus();
  $('#eF', el).onchange = e => { const t = $('#eTo', el); if (!t.value || t.value < e.target.value) t.value = e.target.value; };
  $('#eSave', el).onclick = () => {
    const title = $('#eT', el).value.trim(); let from = $('#eF', el).value, to = $('#eTo', el).value || from;
    if (!title || !from){ toast('Укажите название и дату'); return; }
    if (to < from) [from, to] = [to, from];
    const d = {id: ev.id || ('e'+Date.now().toString(36)), title, from};
    if (to !== from) d.to = to;
    const tm = $('#eTm', el).value.trim(); if (tm) d.time = tm;
    if ($('#eOff', el).checked) d.off = true;
    const nt = $('#eN', el).value.trim(); if (nt) d.note = nt;
    const L = evList(), i = L.findIndex(x => x.id===d.id); if (i>=0) L[i] = d; else L.push(d);
    save(); m.close(); render(); toast('Событие сохранено');
  };
  const del = $('#eDel', el);
  if (del) del.onclick = () => { if (!confirm('Удалить событие «'+ev.title+'»?')) return; S.events = evList().filter(x => x.id!==ev.id); save(); m.close(); render(); toast('Событие удалено'); };
}

/* ============ copy week / day ============ */
function undoLast(){
  let u = null; try { u = JSON.parse(localStorage.getItem(KEY+'-undo')||'null'); } catch(e){}
  if (!u) return toast('Нечего отменять');
  S = u.data; S.settings = Object.assign({}, DEFAULTS, S.settings||{}); if (!Array.isArray(S.events)) S.events = [];
  localStorage.removeItem(KEY+'-undo'); dirty(); save(); render(); toast('Отменено: '+u.label);
}
const stripCourse = t => { const x = t.trim(); if (/\d+\s*\/\s*\d+\s*$/.test(x)) return x.replace(/\s*\d+\s*\/\s*\d+\s*$/,'').trim(); if (/\d[.,]\d+$/.test(x)) return x; return x.replace(/(\S)\s*\d{1,2}$/,'$1').trim(); };
function openCopy(){
  const src = V.week, mon = pdate(src);
  const st = {what:'week', day:V.day||0, to: ymd(addDays(mon,7)), mode:'empty', strip:true, move:false};
  const m = modal(`${mhead('Копировать расписание')}
    <div class="small muted" style="margin-top:4px">Откуда: неделя ${weekTitle(src, S.settings.days)}</div>
    <div class="form">
      <div class="row"><span class="lbl">Что</span><div class="segfull" id="cWhat" style="flex:1"><button data-w="week">Всю неделю</button><button data-w="day">Один день</button></div></div>
      <div class="row" id="cDays"></div>
      <div class="row"><span class="lbl">Куда</span><input type="date" id="cTo" class="date" value="${st.to}"><span id="cToL" class="small"></span></div>
      <div class="row"><span class="lbl">Как</span><div class="segfull" id="cMode" style="flex:1"><button data-c="empty">Только в пустые ячейки</button><button data-c="replace">Заменить всё</button></div></div>
      <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" id="cStrip" checked> Убрать номера занятий («Мирон 4/10», «Мирон 9» → «Мирон»)</label>
      <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" id="cMove"> Перенести: очистить исходную ${'неделю/день'}</label>
    </div>
    <div class="hint" id="cPrev"></div>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" data-x>Отмена</button><button class="btn pri" id="cGo">Скопировать</button></div>`, 540);
  const el = m.el;
  function plan(){
    const w = S.weeks[src], toD = pdate(st.to), tKey = ymd(mondayOf(toD)), ti = (toD.getDay()+6)%7;
    const items = entries(w).filter(e => st.what==='week' || e.i===st.day);
    const target = e => st.what==='week' ? e.i : ti;
    const tw = S.weeks[tKey];
    let conflicts = 0, skipped = 0;
    items.forEach(e => { const cur = tw && tw.d[target(e)] && tw.d[target(e)][e.t]; if (cur){ if (st.mode==='empty') skipped++; else if (cur!==e.txt) conflicts++; } });
    const bad = st.what==='day' && ti >= S.settings.days ? (ti===6 ? 'В воскресенье сетки нет — выберите другой день.' : 'Суббота скрыта. Включите её во вкладке «Данные» → «Сетка».') : '';
    const same = st.what==='week' ? tKey===src : (tKey===src && ti===st.day);
    return {tKey, ti, items, target, conflicts, skipped, bad, same};
  }
  function draw(){
    $$('#cWhat button', el).forEach(b => b.classList.toggle('on', b.dataset.w===st.what));
    $$('#cMode button', el).forEach(b => b.classList.toggle('on', b.dataset.c===st.mode));
    const cd = $('#cDays', el);
    cd.innerHTML = st.what==='day' ? `<div class="segfull" style="flex:1">${[...Array(S.settings.days)].map((_,i)=>`<button class="${i===st.day?'on':''}" data-d="${i}">${DAY[i]} ${addDays(mon,i).getDate()}</button>`).join('')}</div>` : '';
    cd.style.display = st.what==='day' ? '' : 'none';
    $$('[data-d]', cd).forEach(b => b.onclick = () => { st.day = +b.dataset.d; draw(); });
    const P = plan();
    $('#cToL', el).innerHTML = st.what==='week' ? `→ неделя <b>${weekTitle(P.tKey, S.settings.days)}</b>` : `→ <b>${DAYL[P.ti]}, ${dShort(pdate(st.to))}</b>`;
    const n = P.items.length - P.skipped;
    $('#cPrev', el).innerHTML = P.bad ? `<span class="flag">${P.bad}</span>` : P.same ? '<span class="flag">Это то же самое место.</span>' :
      `Будет записано: <b>${n}</b> из ${P.items.length}.` + (P.skipped ? ` Занятые ячейки не трогаю: ${P.skipped}.` : '') + (P.conflicts ? ` <span class="flag">Заменится записей: ${P.conflicts}.</span>` : '') +
      (st.mode==='replace' ? ` Остальные записи ${st.what==='week'?'той недели':'того дня'} будут удалены.` : '');
    $('#cGo', el).disabled = !!(P.bad || P.same || !P.items.length);
    $('#cGo', el).textContent = st.move ? 'Перенести' : 'Скопировать';
  }
  $$('#cWhat button', el).forEach(b => b.onclick = () => { st.what = b.dataset.w; if (st.what==='day'){ st.to = ymd(addDays(mon, st.day+7)); $('#cTo', el).value = st.to; } draw(); });
  $$('#cMode button', el).forEach(b => b.onclick = () => { st.mode = b.dataset.c; draw(); });
  $('#cTo', el).onchange = e => { if (e.target.value){ st.to = e.target.value; draw(); } };
  $('#cStrip', el).onchange = e => { st.strip = e.target.checked; };
  $('#cMove', el).onchange = e => { st.move = e.target.checked; draw(); };
  $('#cGo', el).onclick = () => {
    const P = plan(); if (P.bad || P.same) return;
    snapshot(st.move ? 'Перенос расписания' : 'Копирование расписания');
    const items = P.items.map(e => ({...e}));
    const tw = ensureWeek(P.tKey);
    if (st.mode==='replace'){ if (st.what==='week') tw.d = {}; else delete tw.d[P.ti]; }
    let n = 0;
    items.forEach(e => { const ti = P.target(e); const day = tw.d[ti] || (tw.d[ti] = {});
      if (st.mode==='empty' && day[e.t]) return;
      day[e.t] = st.strip ? stripCourse(e.txt) || e.txt : e.txt; n++; });
    if (st.move){ const sw = S.weeks[src]; if (sw) items.forEach(e => { if (sw.d[e.i]) delete sw.d[e.i][e.t]; }); tidyWeek(src); }
    tidyWeek(P.tKey); dirty(); save(); m.close();
    go('week', {week: P.tKey, day: st.what==='day' ? P.ti : null});
    toast(`${st.move?'Перенесено':'Скопировано'} записей: ${n}`, {label:'Отменить', fn: undoLast});
  };
  draw();
}

/* ============ CALENDAR ============ */
function countsByDate(){
  const mp = new Map();
  for (const [key, w] of Object.entries(S.weeks)){ const mon = pdate(key); for (const e of entries(w)){ const ds = ymd(addDays(mon, e.i)); mp.set(ds, (mp.get(ds)||0)+1); } }
  return mp;
}
function dayEntries(d){
  const w = S.weeks[ymd(mondayOf(d))], i = (d.getDay()+6)%7, day = (w && w.d[i]) || {};
  return Object.keys(day).filter(t=>day[t].trim()).sort().map(t => ({t, txt: day[t]}));
}
function renderCal(){
  const t = today();
  if (V.cal !== 'year') V.yearScroll = null;
  if (!V.calMonth) V.calMonth = monthKey(t);
  if (!V.calYear) V.calYear = t.getFullYear();
  if (V.cal==='year') renderYear(); else renderMonth();
}
function calHead(title, sub, isCurrent, extra=''){
  return `<div class="phead" id="cHead">
    <button class="nav" id="cPrevP" aria-label="Назад">‹</button>
    <div class="ptitle"><h1>${title}</h1><div class="psub">${sub}${isCurrent ? '' : '<button id="cToday">к сегодня</button>'}${extra}</div></div>
    <button class="nav" id="cNextP" aria-label="Вперёд">›</button></div>
  <div class="calbar"><div class="segfull" id="cView"><button data-c="month" class="${V.cal==='month'?'on':''}">Месяц</button><button data-c="year" class="${V.cal==='year'?'on':''}">Год</button></div>
    <button class="btn" id="cAddEv">+ Событие</button></div>`;
}
function bindCalHead(prev, next, addDate, swipeEl){
  $('#cPrevP').onclick = prev; $('#cNextP').onclick = next;
  if ($('#cToday')) $('#cToday').onclick = () => { V.calMonth = monthKey(today()); V.calYear = today().getFullYear(); V.yearScroll = null; renderCal(); };
  $$('#cView button').forEach(b => b.onclick = () => { V.cal = b.dataset.c; V.yearScroll = null; if (V.cal==='year') V.calYear = +V.calMonth.slice(0,4); renderCal(); });
  $('#cAddEv').onclick = () => openEvent({from: addDate});
  addSwipe($('#cHead'), next, prev);
  if (swipeEl) addSwipe(swipeEl, next, prev);
}
function renderMonth(){
  const [y, mo] = V.calMonth.split('-').map(Number);
  const first = new Date(y, mo-1, 1), last = new Date(y, mo, 0), tds = ymd(today());
  const start = mondayOf(first), end = addDays(mondayOf(last), 6);
  const cnt = countsByDate();
  let total = 0; for (let d = new Date(first); d <= last; d = addDays(d,1)) total += cnt.get(ymd(d)) || 0;
  const evMonth = eventsBetween(ymd(first), ymd(last));
  let html = DAY.map(d => `<div class="hd">${d}</div>`).join('') + '<div class="hd" style="text-align:center" title="Занятий за неделю">Σ</div>';
  for (let w = new Date(start); w <= end; w = addDays(w,7)){
    let wsum = 0;
    for (let i=0;i<7;i++){
      const d = addDays(w,i), ds = ymd(d), n = cnt.get(ds) || 0, evs = eventsOn(ds), off = evs.some(e=>e.off);
      wsum += n;
      const list = n ? dayEntries(d) : [];
      html += `<div class="mc ${d.getMonth()!==mo-1?'out':''} ${ds===tds?'today':''} ${i>=5?'wkend':''} ${off?'hatch':''}" data-ds="${ds}">
        <div class="mh"><span class="dn">${d.getDate()}</span>${n?`<span class="mn" title="${n} ${plural(n,'ребёнок','ребёнка','детей')}">${n}<span class="zan"> ${plural(n,'ребёнок','ребёнка','детей')}</span></span>`:''}<button class="add" data-add="${ds}" title="Добавить событие">+</button></div>
        ${evs.map(e=>`<div class="ev ${e.off?'off':''}" data-ev="${e.id}" title="${esc(evLine(e))}">${esc((e.time?e.time+' ':'')+e.title)}</div>`).join('')}
        ${V.calNames && list.length ? `<div class="ml">${list.map(x=>`<div><span>${x.t.slice(0,2)}</span> ${esc(x.txt)}</div>`).join('')}</div>` : ''}
      </div>`;
    }
    html += `<div class="ws" data-wk="${ymd(w)}" title="Открыть неделю">${wsum||''}</div>`;
  }
  $('#main').innerHTML = calHead(monthName(V.calMonth), `<span class="k">${total} ${plural(total,'занятие','занятия','занятий')}</span>`, V.calMonth===monthKey(today()), `<button id="cNames" class="desk-only">${V.calNames?'скрыть имена':'показать имена'}</button>`) +
    `<div class="mgrid">${html}</div>
    ${evMonth.length?`<section class="card"><h3>События месяца</h3><table class="t"><tbody>${evMonth.map(e=>`<tr class="click" data-ev="${e.id}"><td class="nw">${esc(evDates(e))}${e.time?', '+esc(e.time):''}</td><td>${esc(e.title)}${e.off?' <span class="pill">приёма нет</span>':''}</td><td class="muted">${esc(e.note||'')}</td></tr>`).join('')}</tbody></table></section>`:''}
    <div class="hint" style="text-align:center">Нажмите на день — откроется карточка дня. Листать месяцы можно стрелками или свайпом. Σ — занятий за неделю.</div>`;
  const shift = k => { const d = new Date(y, mo-1+k, 1); V.calMonth = monthKey(d); renderMonth(); };
  const defDate = V.calMonth===monthKey(today()) ? tds : ymd(first);
  bindCalHead(() => shift(-1), () => shift(1), defDate, $('.mgrid'));
  $('#cNames').onclick = () => { V.calNames = !V.calNames; renderMonth(); };
  bindCalClicks();
}
function bindCalClicks(){
  $('#main').onclick = e => {
    const ev = e.target.closest('[data-ev]'); if (ev){ e.stopPropagation(); return openEvent(evList().find(x=>x.id===ev.dataset.ev)); }
    const add = e.target.closest('[data-add]'); if (add) return openEvent({from: add.dataset.add});
    const wk = e.target.closest('[data-wk]'); if (wk) return go('week', {week: wk.dataset.wk, day: null});
    const mt = e.target.closest('[data-month]'); if (mt){ V.cal='month'; V.calMonth = mt.dataset.month; return renderCal(); }
    const c = e.target.closest('[data-ds]');
    if (c) openDayInfo(c.dataset.ds);
  };
}
function renderYear(){
  const y = V.calYear, cnt = countsByDate(), tds = ymd(today());
  const q = n => !n ? '' : n<=4 ? 'q1' : n<=7 ? 'q2' : n<=9 ? 'q3' : 'q4';
  let total = 0, months = '';
  for (let mo=0; mo<12; mo++){
    const first = new Date(y, mo, 1), last = new Date(y, mo+1, 0), lead = (first.getDay()+6)%7;
    let ms = 0, cells = DAY.map(d=>`<div class="w">${d[0]}</div>`).join('') + '<div class="c e"></div>'.repeat(lead);
    for (let d = new Date(first); d <= last; d = addDays(d,1)){
      const ds = ymd(d), n = cnt.get(ds) || 0, evs = eventsOn(ds), off = evs.some(e=>e.off);
      ms += n;
      cells += `<div class="c ${off?'off hatch':q(n)} ${evs.length?'hasev':''} ${ds===tds?'td':''} ${n?'has':''}" data-ds="${ds}"><span class="yn">${d.getDate()}</span>${n?`<span class="yc">${n}</span>`:''}</div>`;
    }
    total += ms;
    const ne = eventsBetween(ymd(first), ymd(last)).length;
    months += `<div class="card ym ${monthKey(first)===monthKey(today())?'cur':''}" id="ym-${mo}"><h3 data-month="${monthKey(first)}">${MN[mo]} <small>${ms?ms+' зан.':''}${ne?' · событий '+ne:''}</small></h3><div class="yd">${cells}</div></div>`;
  }
  const evYear = eventsBetween(y+'-01-01', y+'-12-31');
  $('#main').innerHTML = calHead(String(y), `<span class="k">${total} ${plural(total,'занятие','занятия','занятий')}</span>`, y===today().getFullYear()) + `
    <div class="legend" style="margin-top:12px"><span>Цифра в клетке — сколько детей было в этот день. Цвет:</span><span><i class="q1" style="background:var(--q1)"></i>1–4</span><span><i style="background:var(--q2)"></i>5–7</span><span><i style="background:var(--q3)"></i>8–9</span><span><i style="background:var(--q4)"></i>10+</span>
      <span><i style="background:none;box-shadow:inset 0 0 0 2px var(--ev-ring)"></i>событие</span><span><i style="background:var(--off-bg2)"></i>приёма нет</span></div>
    <div class="ygrid">${months}</div>
    <section class="card"><div class="row"><h3 style="margin:0">События ${y}</h3></div>
      ${evYear.length?`<table class="t" style="margin-top:8px"><tbody>${evYear.map(e=>`<tr class="click" data-ev="${e.id}"><td class="nw">${esc(evDates(e))}${e.time?', '+esc(e.time):''}</td><td>${esc(e.title)}${e.off?' <span class="pill">приёма нет</span>':''}</td><td class="muted">${esc(e.note||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="muted small" style="margin-top:6px">Пока нет. Добавьте, например, конференцию или новогодние выходные кнопкой «+ Событие».</div>'}
    </section>
    <div class="ytip" id="ytip"></div>`;
  bindCalHead(() => { V.calYear--; renderYear(); }, () => { V.calYear++; renderYear(); }, y===today().getFullYear() ? tds : y+'-01-01', $('.ygrid'));
  bindCalClicks();
  const tip = $('#ytip');
  $('.ygrid').onmousemove = e => {
    const c = e.target.closest('.c[data-ds]'); if (!c){ tip.style.opacity = 0; return; }
    const d = pdate(c.dataset.ds), n = cnt.get(c.dataset.ds) || 0, evs = eventsOn(c.dataset.ds);
    tip.innerHTML = `<b>${DAY[(d.getDay()+6)%7]}, ${dShort(d)}</b><br>${n ? n+' '+plural(n,'ребёнок','ребёнка','детей') : 'занятий нет'}${evs.map(x=>'<br>• '+esc(evShort(x))).join('')}`;
    tip.style.left = Math.min(e.clientX+12, innerWidth-290)+'px'; tip.style.top = (e.clientY+14)+'px'; tip.style.opacity = 1;
  };
  $('.ygrid').onmouseleave = () => tip.style.opacity = 0;
  const target = y===today().getFullYear() ? today().getMonth() : (V.calMonth && +V.calMonth.slice(0,4)===y ? +V.calMonth.slice(5)-1 : -1);
  if (target >= 0 && V.yearScroll !== y+'-'+target){ V.yearScroll = y+'-'+target; requestAnimationFrame(() => $('#ym-'+target)?.scrollIntoView({block:'start'})); }
}

function openDayInfo(ds){
  const d = pdate(ds), i = (d.getDay()+6)%7, key = ymd(mondayOf(d)), w = S.weeks[key];
  const list = dayEntries(d), evs = eventsOn(ds), canGrid = i < S.settings.days;
  const dn = DAYL[i][0].toUpperCase() + DAYL[i].slice(1);
  const m = modal(`<div class="row"><button class="btn icon" data-nav="-1" title="Предыдущий день">‹</button>
      <h3 style="margin:0;flex:1;text-align:center">${dn}, ${dShort(d)} ${d.getFullYear()}</h3>
      <button class="btn icon" data-nav="1" title="Следующий день">›</button><button class="btn ghost icon" data-x title="Закрыть">×</button></div>
    ${evs.length ? `<div class="evstrip">${evs.map(e=>`<button class="evchip ${e.off?'off':''}" data-ev="${e.id}">${e.time?esc(e.time)+' · ':''}${esc(e.title)}${e.off?' · приёма нет':''}</button>`).join('')}</div>` : ''}
    <div style="margin-top:12px">${list.length ? `<div class="row" style="margin-bottom:6px"><b>${list.length} ${plural(list.length,'ребёнок','ребёнка','детей')}</b></div>
      <table class="t"><tbody>${list.map(x=>`<tr><td class="muted" style="width:60px">${x.t}</td><td>${esc(x.txt)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Занятий нет.</div>'}</div>
    ${list.length && i <= 5 ? `<div class="card dacc" style="margin-top:12px;padding:10px 12px">${dayAccHTML(w, i)}</div>` : ''}
    <div class="row" style="margin-top:14px">
      <button class="btn" data-add>+ Событие</button><span class="sp"></span>
      ${canGrid && list.length ? '<button class="btn" data-send>Отправить</button>' : ''}
      ${canGrid ? '<button class="btn pri" data-open>Открыть в неделе</button>' : ''}

/* ============ SYNC: закрытое хранилище GitHub ============ */
/* У каждой недели и события — метка времени последнего изменения (u). Удаления запоминаются (tomb).

let LJ = null;
const cellsOf = w => { const m = {}; for (const i in (w.d||{})) for (const t in w.d[i]) { const v = w.d[i][t]; if (v && String(v).trim()) m[i+'|'+t] = v; } return m; };

const eJ = e => { const {u, ...r} = e; return JSON.stringify(r); };
const sharedSettings = () => ({template: S.settings.template, days: S.settings.days, satRate: S.settings.satRate, from: S.settings.from, to: S.settings.to});
function initStamp(){
  S.tomb = S.tomb || {}; S.evTomb = S.evTomb || {};
  LJ = {c:{}, f:{}, e:{}, s: JSON.stringify(sharedSettings())};
  for (const k in S.weeks){ LJ.c[k] = cellsOf(S.weeks[k]); LJ.f[k] = fieldsJ(S.weeks[k]); }
  for (const e of evList()) LJ.e[e.id] = eJ(e);
}
function stampChanges(){
  if (!LJ) initStamp();
  S.tomb = S.tomb || {}; S.evTomb = S.evTomb || {};

    const w = S.weeks[k], cur = cellsOf(w), prev = LJ.c[k] || {}; let chg = false;
    for (const key of new Set([...Object.keys(cur), ...Object.keys(prev)])) if (cur[key] !== prev[key]){ (w.cu || (w.cu = {}))[key] = now; chg = true; }
    const fj = fieldsJ(w); if (fj !== LJ.f[k]){ w.fu = now; chg = true; }
    if (chg){ w.u = now; LJ.c[k] = cur; LJ.f[k] = fj; delete S.tomb[k]; ch = true; }
  }
  for (const k in LJ.c) if (!S.weeks[k]){ S.tomb[k] = now; delete LJ.c[k]; delete LJ.f[k]; ch = true; }
  const ids = new Set();
  for (const e of evList()){ ids.add(e.id); const j = eJ(e); if (LJ.e[e.id] !== j){ e.u = now; LJ.e[e.id] = j; delete S.evTomb[e.id]; ch = true; } }
  for (const id in LJ.e) if (!ids.has(id)){ S.evTomb[id] = now; delete LJ.e[id]; ch = true; }

}
function canon(o){
  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  if (o && typeof o === 'object') return '{' + Object.keys(o).filter(k => o[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}';

}
const sharedData = d => ({weeks: d.weeks || {}, events: [...(d.events || [])].sort((a,b) => a.id < b.id ? -1 : 1), tomb: d.tomb || {}, evTomb: d.evTomb || {}, settings: d.settings || null, settingsU: d.settingsU || 0});

function mergeData(L, R){
  const out = {weeks:{}, events:[], tomb:{}, evTomb:{}};
  for (const k of new Set([...Object.keys(L.tomb||{}), ...Object.keys(R.tomb||{})])) out.tomb[k] = Math.max((L.tomb||{})[k]||0, (R.tomb||{})[k]||0);
  for (const k of new Set([...Object.keys(L.evTomb||{}), ...Object.keys(R.evTomb||{})])) out.evTomb[k] = Math.max((L.evTomb||{})[k]||0, (R.evTomb||{})[k]||0);

    const w = mergeWeek((L.weeks||{})[k], (R.weeks||{})[k], out.tomb[k] || 0);

  }
  const ev = {}; [...(L.events||[]), ...(R.events||[])].forEach(e => { const c = ev[e.id]; if (!c || (e.u||0) > (c.u||0)) ev[e.id] = e; });
  out.events = Object.values(ev).filter(e => !(out.evTomb[e.id] && out.evTomb[e.id] >= (e.u||0)));
  const rs = (R.settingsU||0) > (L.settingsU||0);
  out.settings = rs && R.settings ? R.settings : L.settings; out.settingsU = Math.max(L.settingsU||0, R.settingsU||0);

}
/* слияние недели по ячейкам: у каждой ячейки своё время изменения (cu), у остальных полей — fu */
function mergeWeek(a, b, tomb){
  if (!a && !b) return null;
  const A = a || {d:{}}, B = b || {d:{}}, ca = cellsOf(A), cb = cellsOf(B), ta = A.cu || {}, tb = B.cu || {};
  const d = {}, cu = {};
  for (const key of new Set([...Object.keys(ca), ...Object.keys(cb), ...Object.keys(ta), ...Object.keys(tb)])){
    const sa = ta[key] || 0, sb = tb[key] || 0, ts = Math.max(sa, sb);
    const v = !a ? cb[key] : !b ? ca[key] : (sb > sa ? cb[key] : ca[key]);
    if (ts) cu[key] = ts;

  const w = Object.assign({}, tomb && tomb >= fuM ? {} : fields, {d, cu});
  if (fuM) w.fu = fuM;
  w.u = Math.max(A.u || 0, B.u || 0);

}
function applyShared(d){
  S.weeks = d.weeks || {}; S.events = d.events || []; S.tomb = d.tomb || {}; S.evTomb = d.evTomb || {};

  S.settingsU = d.settingsU || 0;

}
const SYNC = {cfg: null, busy: false, again: false, state: 'off', last: 0, err: ''};
function syncCfg(){ try { return JSON.parse(localStorage.getItem(KEY+'-sync') || 'null'); } catch(e){ return null; } }
function setSyncCfg(c){ SYNC.cfg = c; try { c ? localStorage.setItem(KEY+'-sync', JSON.stringify(c)) : localStorage.removeItem(KEY+'-sync'); } catch(e){} }
function deviceName(){ const u = navigator.userAgent; return /iPad/.test(u) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) ? 'iPad' : /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'устройство'; }

const ghUrl = () => `https://api.github.com/repos/${SYNC.cfg.repo}/contents/${encodeURIComponent(SYNC.cfg.path || 'raspisanie.json')}`;
async function ghCheck(){
  const r = await fetch(`https://api.github.com/repos/${SYNC.cfg.repo}`, {headers: ghHeaders(), cache: 'no-store'});
  if (r.status === 401) throw new Error('ключ не подходит — проверьте, что токен скопирован целиком');
  if (r.status === 404 || r.status === 403) throw new Error('хранилище «' + SYNC.cfg.repo + '» не найдено или у ключа нет к нему доступа');
  if (!r.ok) throw new Error('GitHub ответил ' + r.status);
  const j = await r.json(); return j;
}
async function ghGet(){
  const r = await fetch(ghUrl(), {headers: ghHeaders(), cache: 'no-store'});
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error('ключ не подходит или истёк');
  if (!r.ok) throw new Error('GitHub ответил ' + r.status);

async function ghPut(data, sha){

  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(), {method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}), body: JSON.stringify(body)});

function setSync(state, err){

function syncStatusText(){

  const t = SYNC.last ? new Date(SYNC.last).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
  return {busy: 'Синхронизация…', ok: 'Синхронизировано' + (t ? ' в ' + t : ''), offline: 'Нет интернета — изменения сохранены на устройстве и отправятся позже', err: '<span class="flag">Ошибка: ' + esc(SYNC.err) + '</span>', off: 'Подключена'}[SYNC.state] || '';

function syncSoon(){ if (!SYNC.cfg) return; clearTimeout(syncSoon._t); syncSoon._t = setTimeout(syncNow, 2500); }
async function syncNow(){

    for (let attempt = 0; attempt < 4; attempt++){
      const remote = await ghGet();
      if (remote && remote.data && remote.data.weeks){
        const before = canon(sharedData(localPayload()));
        applyShared(mergeData(localPayload(), remote.data));
        if (canon(sharedData(localPayload())) !== before) changed = true;

function parseSyncKey(str, repoField){
